name: InvCon CI

on: [push, pull_request]

jobs:
  L1-docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: true
      - name: Build Docker image
        run: docker build -t invcon .

  L2-smoke-test:
    runs-on: ubuntu-latest
    needs: L1-docker-build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: true
      - name: Build Docker image
        run: docker build --no-cache -t invcon .
        
      - name: Debug API key
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          echo "Key length: ${#ETHERSCAN_API_KEY}"
          
      - name: Debug Daikon build
        run: |
          docker run --rm --entrypoint bash invcon -c "
            java -version 2>&1 &&
            java -cp /app/daikon-5.8.6/daikon.jar daikon.Daikon --help 2>&1 | head -10
          "
          
      - name: Run smoke test
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          docker run --rm \
            -e ETHERSCAN_API_KEY \
            invcon \
            --eth_address 0x0e9d46eed51a527db8f5c12a803eb7fddf4da332 \
            | tee output.txt || true
            
      - name: Validate output
        run: |
          grep -q "finished" output.txt || { echo "FAIL: invcon did not complete"; exit 1; }
         
  L3-hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: true
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf
        with:
          dockerfile: Dockerfile
          ignore: DL3008 
